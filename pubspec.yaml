name: mp3_direct_cut
description: "Linux desktop app that cuts ads and outros out of MP3 files and splits long files into parts, frame by frame and without re-encoding, across a whole folder at once."
publish_to: 'none'
version: 0.0.2

environment:
  sdk: ^3.13.7

dependencies:
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
